<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Notas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Calculadora de Notas</h1>
    <p>Digite as três notas para calcular a média.</p>
    <label for="nota1">Primeira nota</label>
    <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Ex.: 8">
    <label for="nota2">Segunda nota</label>
    <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Ex.: 7">
    <label for="nota3">Terceira nota</label>
    <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="Ex.: 9">
    <button onclick="calcularMedia()">Calcular média</button>
    <div id="resultado" aria-live="polite"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
